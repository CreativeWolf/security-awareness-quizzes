<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise Security Awareness Simulator</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --surface: #ffffff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --success: #16a34a;
      --success-hover: #15803d;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #111827;
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      background: #374151;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #93c5fd;
    }

    .main-layout {
      max-width: 900px;
      width: 100%;
      margin: 28px auto;
      padding: 0 16px;
      flex-grow: 1;
    }

    .scenario-container {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .context-toolbar {
      background: #0b1329;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .context-tag {
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: monospace;
      color: #38bdf8;
    }

    .mockup-body {
      padding: 32px 24px;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
    }

    .scenario-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 24px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .scenario-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scenario-desc {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #334155;
      margin-bottom: 16px;
    }

    .interactive-snippet {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 14px;
      font-size: 0.88rem;
      line-height: 1.5;
      color: #1e293b;
      margin-bottom: 16px;
    }

    .decision-footer {
      padding: 20px 24px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      padding: 10px 22px;
      font-size: 0.92rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }

    .btn-hazard {
      background: var(--danger);
      color: #fff;
    }
    .btn-hazard:hover { background: var(--danger-hover); }

    .btn-compliant {
      background: var(--success);
      color: #fff;
    }
    .btn-compliant:hover { background: var(--success-hover); }

    .btn-next {
      background: var(--accent);
      color: #fff;
    }
    .btn-next:hover { background: var(--accent-hover); }

    .analysis-panel {
      padding: 24px;
      border-top: 1px solid var(--border);
      background: #0b1329;
    }

    .analysis-status {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .text-danger { color: #f87171; }
    .text-success { color: #4ade80; }

    .analysis-text {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .hidden { display: none !important; }
  </style>
</head>

    // Shuffle guaranteeing no consecutive tactic repetitions
    function generateNonConsecutivePlaylist(items) {
      let pool = [...items];
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }

      const result = [];
      while (pool.length > 0) {
        const lastTactic = result.length > 0 ? result[result.length - 1].tactic : null;
        const candidateIdx = pool.findIndex(item => item.tactic !== lastTactic);

        if (candidateIdx !== -1) {
          result.push(pool.splice(candidateIdx, 1)[0]);
        } else {
          const orphan = pool.pop();
          let swapped = false;
          for (let i = result.length - 2; i >= 0; i--) {
            const prev = result[i];
            const next = result[i + 1];
            if (prev.tactic !== orphan.tactic && (!next || next.tactic !== orphan.tactic)) {
              result.splice(i + 1, 0, orphan);
              swapped = true;
              break;
            }
          }
          if (!swapped) {
            result.unshift(orphan);
          }
        }
      }
      return result;
    }

      mockupContent.innerHTML = data.html;
      stepCounter.textContent = `Scenario ${index + 1} of ${activeScenarios.length}`;
      
      decisionControls.classList.remove("hidden");
      analysisPanel.classList.add("hidden");
    }

    function evaluateChoice(userChoseViolation) {
      const data = activeScenarios[currentStep];
      const isCorrect = userChoseViolation === data.isViolation;

      if (isCorrect) score++;

      decisionControls.classList.add("hidden");
      analysisPanel.classList.remove("hidden");

      if (isCorrect) {
        analysisHeader.className = "analysis-status text-success";
        analysisHeader.innerHTML = `✓ Correct Assessment (${data.tactic})`;
      } else {
        analysisHeader.className = "analysis-status text-danger";
        analysisHeader.innerHTML = `✗ Vulnerability Misidentified (${data.tactic})`;
      }

      analysisBody.innerHTML = data.explanation;
    }

    function loadNextScenario() {
      currentStep++;
      if (currentStep < activeScenarios.length) {
        loadScenario(currentStep);
      } else {
        displayResults();
      }
    }

    function displayResults() {
      scenarioViewport.classList.add("hidden");
      analysisPanel.classList.add("hidden");
      decisionControls.classList.add("hidden");
      finalStats.classList.remove("hidden");
      stepCounter.textContent = "Finished";

      const percentage = Math.round((score / activeScenarios.length) * 100);
      let verdict = "";

      if (percentage >= 90) {
        verdict = "Outstanding! You demonstrate exceptional operational security hygiene across physical, cloud, and collaborative environments.";
      } else if (percentage >= 70) {
        verdict = "Solid awareness. Review physical security controls and out-of-band verification steps.";
      } else {
        verdict = "High organizational risk. Pay close attention to physical access, data disposal, and mobile security.";
      }

      scoreText.innerHTML = `You correctly evaluated <strong>${score} out of ${activeScenarios.length}</strong> scenarios (${percentage}%).<br><br>${verdict}`;
    }

    function resetQuiz() {
      currentStep = 0;
      score = 0;
      activeScenarios = generateNonConsecutivePlaylist(scenarios);
      finalStats.classList.add("hidden");
      scenarioViewport.classList.remove("hidden");
      loadScenario(0);
    }

    // Initialize randomized assessment
    resetQuiz();
  </script>
</body>
</html>
