<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Social Engineering & Credential Harvesting Simulator</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --surface: #ffffff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --success: #16a34a;
      --success-hover: #15803d;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #111827;
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      background: #374151;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #93c5fd;
    }

    .main-layout {
      max-width: 920px;
      width: 100%;
      margin: 28px auto;
      padding: 0 16px;
      flex-grow: 1;
    }

    .scenario-container {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .category-banner {
      background: #172554;
      padding: 10px 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #bfdbfe;
      border-bottom: 1px solid #1e3a8a;
      display: flex;
      justify-content: space-between;
    }

    .browser-toolbar {
      background: #e2e8f0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #cbd5e1;
    }

    .fake-buttons {
      display: flex;
      gap: 6px;
    }

    .circle-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .url-bar-sim {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px 14px;
      flex-grow: 1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      color: #1e293b;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .mockup-body {
      padding: 32px 24px;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
    }

    /* Embedded card and UI component styling */
    .card-sim {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .instruction-steps {
      text-align: left;
      margin: 14px 0;
      padding: 14px;
      background: #f1f5f9;
      border-radius: 6px;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .permission-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 10px 0;
      font-size: 0.85rem;
      color: #475569;
    }

    .code-box {
      font-family: monospace;
      font-size: 1.3rem;
      letter-spacing: 4px;
      background: #f1f5f9;
      border: 1px dashed #94a3b8;
      padding: 10px 16px;
      margin: 12px 0;
      text-align: center;
      color: #0f172a;
      font-weight: bold;
    }

    .decision-footer {
      padding: 20px 24px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      padding: 10px 20px;
      font-size: 0.92rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }

    .btn-malicious {
      background: var(--danger);
      color: #fff;
    }
    .btn-malicious:hover { background: var(--danger-hover); }

    .btn-safe {
      background: var(--success);
      color: #fff;
    }
    .btn-safe:hover { background: var(--success-hover); }

    .btn-next {
      background: var(--accent);
      color: #fff;
    }
    .btn-next:hover { background: var(--accent-hover); }

    .analysis-panel {
      padding: 24px;
      border-top: 1px solid var(--border);
      background: #0b1329;
    }

    .analysis-status {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .text-danger { color: #f87171; }
    .text-success { color: #4ade80; }

    .analysis-text {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .hidden { display: none !important; }
  </style>
</head>

        <div style="display: flex; gap: 12px;">

        <h2 style="font-size: 2rem; margin-bottom: 12px;">Assessment Finished</h2>

    const analysisHeader = document.getElementById("analysis-header");

    const finalStats = document.getElementById("final-stats");

    // Shuffles an array ensuring no adjacent items share the same 'tactic'
    function generateNonConsecutivePlaylist(items) {
      let pool = [...items];
      // Initial Fisher-Yates shuffle
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }

      // Reorder to guarantee no two adjacent items share the same tactic
      const result = [];
      while (pool.length > 0) {
        const lastTactic = result.length > 0 ? result[result.length - 1].tactic : null;
        
        // Find the first item whose tactic differs from the previous one
        const candidateIdx = pool.findIndex(item => item.tactic !== lastTactic);

        if (candidateIdx !== -1) {
          result.push(pool.splice(candidateIdx, 1)[0]);
        } else {
          // If only matching tactics remain at the end, swap backwards into a safe slot
          const orphan = pool.pop();
          let swapped = false;
          for (let i = result.length - 2; i >= 0; i--) {
            const prev = result[i];
            const next = result[i + 1];
            if (prev.tactic !== orphan.tactic && (!next || next.tactic !== orphan.tactic)) {
              result.splice(i + 1, 0, orphan);
              swapped = true;
              break;
            }
          }
          if (!swapped) {
            result.unshift(orphan);
          }
        }
      }
      return result;
    }

    function loadScenario(index) {
      const data = activeScenarios[index];
      browserAddress.textContent = data.url;
      mockupContent.innerHTML = data.html;
      stepCounter.textContent = `Scenario ${index + 1} of ${activeScenarios.length}`;
      
      decisionControls.classList.remove("hidden");
      analysisPanel.classList.add("hidden");
    }

    function evaluateChoice(userChoseMalicious) {
      const data = activeScenarios[currentStep];
      const isCorrect = userChoseMalicious === data.isMalicious;

      if (isCorrect) score++;

      decisionControls.classList.add("hidden");
      analysisPanel.classList.remove("hidden");

      if (isCorrect) {
        analysisHeader.className = "analysis-status text-success";
        // analysisHeader.innerHTML = `✓ Correct Decision (${data.tactic})`;
        analysisHeader.innerHTML = `✓ Correct Decision!`;
      } else {
        analysisHeader.className = "analysis-status text-danger";
        // analysisHeader.innerHTML = `✗ Incorrect Decision (${data.tactic})`;
        analysisHeader.innerHTML = `✗ Incorrect Decision!`;
      }

      analysisBody.innerHTML = data.explanation;
    }

    function loadNextScenario() {
      currentStep++;
      if (currentStep < activeScenarios.length) {
        loadScenario(currentStep);
      } else {
        displayResults();
      }
    }

    function displayResults() {
      scenarioViewport.classList.add("hidden");
      analysisPanel.classList.add("hidden");
      decisionControls.classList.add("hidden");
      finalStats.classList.remove("hidden");
      stepCounter.textContent = "Finished";

      const percentage = Math.round((score / activeScenarios.length) * 100);
      let verdict = "";

      if (percentage >= 90) {
        verdict = "Excellent! You are highly proficient in identifying modern non-traditional phishing vectors.";
      } else if (percentage >= 70) {
        verdict = "Good baseline awareness. Pay close attention to subtle URL redirections and application scope grants.";
      } else {
        verdict = "High exposure risk. Modern threats bypass passwords using token theft and terminal injection.";
      }

      scoreText.innerHTML = `You correctly identified <strong>${score} out of ${activeScenarios.length}</strong> scenarios (${percentage}%).<br><br>${verdict}`;
    }

    function resetQuiz() {
      currentStep = 0;
      score = 0;
      activeScenarios = generateNonConsecutivePlaylist(scenarios);
      finalStats.classList.add("hidden");
      scenarioViewport.classList.remove("hidden");
      loadScenario(0);
    }

    // Initialize randomized playlist on load
